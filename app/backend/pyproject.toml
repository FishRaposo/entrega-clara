[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "entrega-clara-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.16,<3",
  "mypy>=1.15,<2",
  # The optional PostgreSQL adapter is imported by the type checker and by the
  # persistence contract tests, so development installs include its drivers.
  "psycopg[binary]>=3.1,<4",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "sqlalchemy>=2.0,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["delivery_platform"]

[tool.setuptools.packages.find]
where = ["src"]

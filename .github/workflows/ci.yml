name: CI

on:
  push:
  pull_request:

jobs:
  backend-and-repository:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e "app/backend[dev]"
      - name: Validate deterministic seed data
        run: python scripts/data/validate_seed.py data/scenarios/lunch-rush.json
      - name: Check requirements traceability
        run: python scripts/quality/check_requirement_coverage.py docs/requirements/traceability.md
      - name: Check application boundary
        run: python scripts/repo/check_app_boundary.py
      - name: Check committed whitespace
        run: git diff --check $(git rev-list --max-parents=0 HEAD)..HEAD
        shell: bash
      - name: Run backend and repository tests
        run: python -m pytest tests -q
      - name: Lint backend and repository code
        run: ruff check app/backend/src tests
      - name: Type-check backend
        run: mypy app/backend/src
      - name: Benchmark harness smoke (stdlib only)
        run: python scripts/bench/routing_benchmark.py --smoke
        if: matrix.os == 'ubuntu-latest'
      - name: Check static lab freshness
        run: python scripts/media/check_static_lab.py
        if: matrix.os == 'ubuntu-latest'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test -- --run
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  e2e:
    # Ubuntu 26.04 (current ubuntu-latest) is not supported by the pinned
    # Playwright version; 24.04 is. See the install step below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -e "app/backend[dev]"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app/web
      - name: Run browser journeys and a11y scans
        run: npx playwright test
        working-directory: app/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/web/playwright-report
          retention-days: 7
